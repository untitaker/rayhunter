[package]
name = "fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "fuzz-afl-main"
path = "src/bin/fuzz-afl-main.rs"

[[bin]]
name = "fuzz-main"
path = "src/bin/fuzz-main.rs"

[[bin]]
name = "qmdl-split"
path = "src/bin/qmdl-split.rs"

[[bin]]
name = "fuzz-afl-differential"
path = "src/bin/fuzz-afl-differential.rs"

[[bin]]
name = "test-differential"
path = "src/bin/test-differential.rs"

[dependencies]
rayhunter = { path = "../lib" }
rayhunter-old = { package = "rayhunter", git = "https://github.com/EFForg/rayhunter", rev = "6179317" }
afl = "0.15"
deku = "0.20"
deku-old = { package = "deku", version = "0.18" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
